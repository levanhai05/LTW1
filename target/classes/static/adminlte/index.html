<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quản lý Đào tạo - Gộp Index1 & Index2</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    overflow:hidden;
}

.topbar{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:12px;
    border-bottom:1px solid #334155;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:#2563eb;
}

button:hover{
    opacity:0.9;
}

iframe{
    width:100%;
    height:calc(100vh - 60px);
    border:none;
    display:none;
    background:white;
}

iframe.active{
    display:block;
}
</style>
</head>

<body>

<div class="topbar">
    <button onclick="showFrame('admin')">Admin Dashboard</button>
    <button onclick="showFrame('portal')">Student/Lecturer Portal</button>
</div>

<iframe id="adminFrame" class="active" src="index1.html"></iframe>
<iframe id="portalFrame" src="index2.html"></iframe>

<script>
function showFrame(type){
    const admin = document.getElementById('adminFrame');
    const portal = document.getElementById('portalFrame');

    admin.classList.remove('active');
    portal.classList.remove('active');

    if(type === 'admin'){
        admin.classList.add('active');
    }else{
        portal.classList.add('active');
    }
}
</script>

</body>
</html>
